<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prestige FC Admin</title><style>
body{margin:0;background:#070707;color:#f5f5f2;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#111;border:1px solid #2b2b2b;border-radius:16px;padding:18px;margin:14px 0}h1,h2{font-family:Impact,Arial Narrow,sans-serif;text-transform:uppercase}input,select,textarea{width:100%;box-sizing:border-box;background:#080808;color:#fff;border:1px solid #444;border-radius:9px;padding:12px;margin:6px 0 12px}textarea{min-height:100px}button{background:#fff;color:#000;border:0;border-radius:9px;padding:12px 16px;font-weight:800;margin:4px;cursor:pointer}.danger{background:#401515;color:#fff}.tabs{display:flex;gap:6px;overflow:auto}.tab{display:none}.tab.active{display:block}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;border-bottom:1px solid #252525;padding:9px 0;align-items:center}.muted{color:#999}.ok{color:#a8f5a8}.err{color:#ff9a9a}@media(max-width:600px){.row{grid-template-columns:1fr 1fr}.row button{grid-column:1/-1}}
</style></head><body><div class="wrap"><h1>PRESTIGE FC</h1><p class="muted">PRIVATE ADMIN PANEL</p>
<div id="login" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Your email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="loginMsg"></p></div>
<div id="app" style="display:none"><div class="tabs"><button onclick="tab('squad')">Squad</button><button onclick="tab('setpieces')">Set Pieces</button><button onclick="tab('fixtures')">Fixtures</button><button onclick="tab('results')">Results</button><button onclick="tab('news')">News</button><button onclick="tab('club')">Club</button><button onclick="logout()">Log out</button></div>
<div id="squad" class="tab card"><h2>Squad</h2><input id="pn" placeholder="Player name"><select id="pp"><option>GK</option><option>CB</option><option>LB</option><option>RB</option><option>CDM</option><option>CM</option><option>CAM</option><option>LW</option><option>RW</option><option>ST</option></select><button onclick="addPlayer()">Add player</button><div id="players"></div></div>
<div id="setpieces" class="tab card"><h2>Set Pieces</h2><div id="sp"></div><button onclick="saveSP()">Save</button><p id="spmsg"></p></div>
<div id="fixtures" class="tab card"><h2>Fixtures</h2><input id="fo" placeholder="Opponent"><input id="fd" type="date"><input id="ft" placeholder="Time"><input id="fv" placeholder="Venue"><button onclick="addFixture()">Publish fixture</button><div id="flist"></div></div>
<div id="results" class="tab card"><h2>Results</h2><input id="ro" placeholder="Opponent"><input id="rs" type="number" placeholder="Prestige score"><input id="os" type="number" placeholder="Opponent score"><input id="rd" type="date"><button onclick="addResult()">Publish result</button><div id="rlist"></div></div>
<div id="news" class="tab card"><h2>News</h2><input id="nt" placeholder="Headline"><textarea id="nb" placeholder="News text"></textarea><input id="nd" type="date"><button onclick="addNews()">Publish news</button><div id="nlist"></div></div>
<div id="club" class="tab card"><h2>Club settings</h2><input id="managers" placeholder="Managers"><input id="tagline" placeholder="Tagline"><button onclick="saveClub()">Save club</button><hr><h2>Starting XI</h2><p id="xistate">Hidden</p><button onclick="toggleXI()">Toggle Starting XI</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null;const $=x=>document.getElementById(x);function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;return}user=r.data.user;let a=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!a.data){await sb.auth.signOut();$('loginMsg').textContent='This account is not authorized.';return}$('login').style.display='none';$('app').style.display='block';tab('squad');loadAll()}async function logout(){await sb.auth.signOut();location.reload()}
async function loadAll(){loadPlayers();loadSP();loadFixtures();loadResults();loadNews();loadClub()}
async function loadPlayers(){let r=await sb.from('players').select('*').order('squad_order');$('players').innerHTML=(r.data||[]).map(p=>`<div class="row"><span>${p.name}<br><small>${p.position}</small></span><button onclick="editPlayer('${p.id}')">Edit</button><button class="danger" onclick="delPlayer('${p.id}')">Delete</button></div>`).join('')}
async function editPlayer(id){let n=prompt('Player name?');if(!n)return;let p=prompt('Position? (GK/CB/CM/CAM/ST etc.)');if(!p)return;await sb.from('players').update({name:n,position:p}).eq('id',id);loadPlayers()}async function delPlayer(id){if(confirm('Delete player?')){await sb.from('players').delete().eq('id',id);loadPlayers()}}async function addPlayer(){if(!$('pn').value)return;let q=await sb.from('players').select('squad_order').order('squad_order',{ascending:false}).limit(1);await sb.from('players').insert({name:$('pn').value,position:$('pp').value,squad_order:(q.data?.[0]?.squad_order||0)+1});$('pn').value='';loadPlayers()}
const keys=[['penalties','Penalties'],['right_corners','Right corners'],['left_corners','Left corners'],['long_free_kicks','Long free kicks'],['short_free_kicks','Short free kicks'],['throw_ins','Throw-ins']];async function loadSP(){let r=await sb.from('set_pieces').select('*').eq('id',1).single();$('sp').innerHTML=keys.map(k=>`<label>${k[1]}</label><textarea id="sp_${k[0]}">${(r.data?.[k[0]]||[]).join('\n')}</textarea>`).join('')}async function saveSP(){let o={};keys.forEach(k=>o[k[0]]=$('sp_'+k[0]).value.split('\n').map(x=>x.trim()).filter(Boolean));let r=await sb.from('set_pieces').update(o).eq('id',1);$('spmsg').textContent=r.error?r.error.message:'Saved.'}
async function loadFixtures(){let r=await sb.from('fixtures').select('*').order('match_date');$('flist').innerHTML=(r.data||[]).map(x=>`<div class="row"><span>vs ${x.opponent}<br><small>${x.match_date||''} ${x.match_time||''} · ${x.venue||''}</small></span><button class="danger" onclick="del('fixtures','${x.id}',loadFixtures)">Delete</button></div>`).join('')}async function addFixture(){await sb.from('fixtures').insert({opponent:$('fo').value,match_date:$('fd').value||null,match_time:$('ft').value,venue:$('fv').value});loadFixtures()}
async function loadResults(){let r=await sb.from('results').select('*').order('match_date',{ascending:false});$('rlist').innerHTML=(r.data||[]).map(x=>`<div class="row"><span>Prestige ${x.prestige_score} — ${x.opponent_score} ${x.opponent}<br><small>${x.match_date||''}</small></span><button class="danger" onclick="del('results','${x.id}',loadResults)">Delete</button></div>`).join('')}async function addResult(){await sb.from('results').insert({opponent:$('ro').value,prestige_score:+$('rs').value,opponent_score:+$('os').value,match_date:$('rd').value||null});loadResults()}
async function loadNews(){let r=await sb.from('news').select('*').order('published_at',{ascending:false});$('nlist').innerHTML=(r.data||[]).map(x=>`<div class="row"><span>${x.title}<br><small>${x.published_at||''}</small></span><button class="danger" onclick="del('news','${x.id}',loadNews)">Delete</button></div>`).join('')}async function addNews(){await sb.from('news').insert({title:$('nt').value,body:$('nb').value,published_at:$('nd').value||null});loadNews()}
async function loadClub(){let r=await sb.from('club_settings').select('*').eq('id',1).single();if(r.data){$('managers').value=r.data.managers;$('tagline').value=r.data.tagline;$('xistate').textContent='Starting XI: '+(r.data.starting_xi_published?'PUBLISHED':'HIDDEN')}}async function saveClub(){await sb.from('club_settings').update({managers:$('managers').value,tagline:$('tagline').value}).eq('id',1);loadClub()}async function toggleXI(){let r=await sb.from('club_settings').select('starting_xi_published').eq('id',1).single();await sb.from('club_settings').update({starting_xi_published:!r.data.starting_xi_published}).eq('id',1);loadClub()}async function del(table,id,cb){if(confirm('Delete?')){await sb.from(table).delete().eq('id',id);cb()}}
</script></body></html>
